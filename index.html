<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USI (Unified Signature Infrastructure)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #111; margin: 0; padding: 0; overflow: hidden; }
    .signature-font { font-family: 'Caveat', cursive; }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    canvas { touch-action: none; }
    
    .minimal-input {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .minimal-input:focus {
      border-color: #111;
      box-shadow: 0 0 0 1px #111;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const USE_CASES = {
      hospital: { id: 'hospital', label: '🏥 Hospital', title: 'Global Hospital Reg.', entity: 'Global Hospital API', role: 'Patient Name', consent: 'medical procedures and hospital admission.' },
      bank: { id: 'bank', label: '🏦 Bank', title: 'FinCorp Bank KYC', entity: 'FinCorp Bank API', role: 'Account Holder', consent: 'account opening and financial terms & conditions.' },
      gov: { id: 'gov', label: '🏛️ Government', title: 'National Tax Portal', entity: 'Gov Tax Dept API', role: 'Citizen Name', consent: 'official tax declaration and legal submissions.' },
      event: { id: 'event', label: '🎟️ Conference', title: 'Tech Summit 2026', entity: 'Tech Summit Reg.', role: 'Attendee Name', consent: 'event registration and liability waiver.' }
    };

    function App() {
      const [page, setPage] = useState(1); // 1, 2, 3, or 4
      
      // --- Page 1: Enrollment State ---
      const [signMode, setSignMode] = useState("draw"); // draw or upload
      const [signatureImage, setSignatureImage] = useState(null);
      const [otpStep, setOtpStep] = useState(false);
      const [otpValue, setOtpValue] = useState("");
      const [dsid, setDsid] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);

      // --- Page 2: Usage State ---
      const [activeUseCase, setActiveUseCase] = useState(USE_CASES.hospital);
      const [enteredDsid, setEnteredDsid] = useState("");
      const [showConsent, setShowConsent] = useState(false);
      const [status, setStatus] = useState("idle");
      
      // --- Page 3: Audit State ---
      const [auditLogs, setAuditLogs] = useState([]);

      // --- Canvas Logic (Page 1) ---
      useEffect(() => {
        if (page === 1 && signMode === "draw" && canvasRef.current && !dsid && !otpStep) {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#000'; 
        }
      }, [page, signMode, dsid, otpStep]);

      const startDrawing = (e) => {
        if (dsid || otpStep || signMode !== "draw") return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing || dsid || otpStep || signMode !== "draw") return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.stroke();
      };

      const stopDrawing = () => {
        if (isDrawing && !dsid) {
          setIsDrawing(false);
          setSignatureImage(canvasRef.current.toDataURL());
        }
      };

      const clearCanvas = () => {
        if (dsid) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        setSignatureImage(null);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => setSignatureImage(event.target.result);
          reader.readAsDataURL(file);
        }
      };

      // --- Core Workflows ---
      const handleRequestOTP = () => {
        if (!signatureImage) return alert("Please provide your signature first.");
        setOtpStep(true);
      };

      const handleVerifyOTP = (e) => {
        e.preventDefault();
        if(otpValue.length < 4) return alert("Enter valid OTP");
        setIsGenerating(true);
        
        setTimeout(() => {
          const generatedDsid = "DSID-GBL-88X2-V9M";
          setDsid(generatedDsid);
          // INTENTIONALLY NOT AUTO-FILLING ENTERED DSID FOR PAGE 2
          setIsGenerating(false);
          setOtpStep(false);
          addLog("Enrollment", "National ID Vault", "Vaulted");
        }, 1000);
      };

      const handleSubmitIntegration = (e) => {
        e.preventDefault();
        if (enteredDsid !== dsid) {
          alert("Invalid DSID. Please use the exact ID generated in Step 1.");
          return;
        }
        setShowConsent(true);
      };

      const handleConsent = (approved) => {
        setShowConsent(false);
        setStatus(approved ? "approved" : "denied");
        
        if(approved) {
           addLog("Signature Injection", activeUseCase.entity, "Approved");
        } else {
           addLog("Signature Injection", activeUseCase.entity, "Denied");
        }
      };
      
      const addLog = (action, entity, initialStatus) => {
         const newLog = {
            id: Math.random().toString(36).substr(2, 9),
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
            action,
            entity,
            status: initialStatus
         };
         setAuditLogs(prev => [newLog, ...prev]);
      };

      const handleRevoke = (logId) => {
        setAuditLogs(logs => logs.map(log => 
            log.id === logId ? { ...log, status: 'Revoked', time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) } : log
        ));
      };

      const resetApp = () => {
         setPage(1);
         setSignMode("draw");
         setSignatureImage(null);
         setOtpStep(false);
         setOtpValue("");
         setDsid(null);
         setEnteredDsid("");
         setStatus("idle");
         setAuditLogs([]);
         setActiveUseCase(USE_CASES.hospital);
      };

      // --- UI Components ---
      const Header = ({ step, title }) => (
        <header className="w-full flex justify-between items-center py-6 px-10 border-b border-gray-200 bg-white absolute top-0 z-10">
          <div className="flex items-center space-x-3">
             <div className="w-8 h-8 bg-black text-white rounded-md flex items-center justify-center font-bold text-sm">{step}</div>
             <h1 className="text-xl font-semibold tracking-tight">{title}</h1>
          </div>
          <div className="flex space-x-2 text-sm font-medium text-gray-400">
             <span className={page === 1 ? 'text-black' : ''}>Vault</span>
             <span>&rarr;</span>
             <span className={page === 2 ? 'text-black' : ''}>API Usage</span>
             <span>&rarr;</span>
             <span className={page === 3 ? 'text-black' : ''}>Audit</span>
             <span>&rarr;</span>
             <span className={page === 4 ? 'text-black' : ''}>Summary</span>
          </div>
        </header>
      );

      return (
        <div className="h-screen w-screen overflow-hidden flex flex-col bg-[#fafafa]">
          
          {/* PAGE 1: ENROLLMENT */}
          {page === 1 && (
            <div className="h-full w-full flex flex-col pt-24 fade-in">
              <Header step="1" title="National ID Portal" />
              
              <div className="flex-1 flex flex-col items-center justify-center px-4">
                 <div className="max-w-md w-full">
                    <div className="text-center mb-6">
                       <h2 className="text-2xl font-medium tracking-tight mb-2">Initialize Your DSID</h2>
                       <p className="text-gray-500 text-sm">Create your official signature to securely vault it.</p>
                    </div>

                    {!dsid && !otpStep && (
                      <div className="space-y-4">
                        
                        <div className="flex space-x-2 bg-gray-100 p-1 rounded-lg">
                           <button onClick={() => {setSignMode("draw"); setSignatureImage(null);}} className={`flex-1 py-1.5 text-sm font-medium rounded-md transition-colors ${signMode === "draw" ? "bg-white shadow-sm text-black" : "text-gray-500 hover:text-black"}`}>Draw</button>
                           <button onClick={() => {setSignMode("upload"); setSignatureImage(null);}} className={`flex-1 py-1.5 text-sm font-medium rounded-md transition-colors ${signMode === "upload" ? "bg-white shadow-sm text-black" : "text-gray-500 hover:text-black"}`}>Upload</button>
                        </div>

                        <div className="bg-white p-2 rounded-xl border border-gray-200 shadow-sm relative">
                          {signMode === "draw" ? (
                              <>
                                <canvas ref={canvasRef} width={450} height={180} className="w-full h-40 bg-gray-50 rounded-lg cursor-crosshair" onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} />
                                <button onClick={clearCanvas} className="absolute bottom-4 right-4 text-xs font-medium text-gray-500 hover:text-black bg-white px-3 py-1 rounded shadow-sm border border-gray-200">Clear</button>
                              </>
                          ) : (
                              <div className="w-full h-40 bg-gray-50 rounded-lg flex items-center justify-center relative overflow-hidden">
                                {!signatureImage ? (
                                   <input type="file" accept="image/*" onChange={handleFileUpload} className="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-medium file:bg-black file:text-white cursor-pointer" />
                                ) : (
                                   <>
                                     <img src={signatureImage} className="max-h-full max-w-full object-contain p-2" alt="Uploaded Signature" />
                                     <button onClick={() => setSignatureImage(null)} className="absolute top-2 right-2 text-xs bg-white px-2 py-1 rounded shadow border border-gray-200">Change</button>
                                   </>
                                )}
                              </div>
                          )}
                        </div>
                        <button onClick={handleRequestOTP} className="w-full bg-black text-white font-medium py-3 px-4 rounded-lg hover:bg-gray-800 transition-colors">
                          Save to Secure Vault
                        </button>
                      </div>
                    )}

                    {otpStep && (
                       <div className="bg-white p-6 border border-gray-200 rounded-xl shadow-sm fade-in text-center">
                          <p className="text-sm text-gray-500 mb-4">Enter the 6-digit OTP sent to your Aadhaar-linked mobile.</p>
                          <form onSubmit={handleVerifyOTP} className="space-y-4">
                             <input type="text" maxLength="6" value={otpValue} onChange={(e) => setOtpValue(e.target.value.replace(/\D/g, ''))} placeholder="• • • • • •" className="minimal-input w-full p-3 text-center text-xl tracking-widest font-mono" required />
                             <button type="submit" disabled={isGenerating} className="w-full bg-black text-white font-medium py-3 px-4 rounded-lg hover:bg-gray-800 transition-colors">
                               {isGenerating ? 'Encrypting...' : 'Verify OTP & Generate'}
                             </button>
                          </form>
                       </div>
                    )}

                    {dsid && (
                      <div className="bg-white border border-gray-200 p-6 rounded-xl fade-in text-center shadow-sm">
                        <div className="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3">
                           <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 className="text-lg font-medium text-gray-900 mb-1">Signature Vaulted</h3>
                        <p className="text-sm text-gray-500 mb-4">Your unique Digital Signature ID is ready.</p>
                        
                        <div className="bg-gray-50 border border-gray-200 py-2 px-4 rounded-lg inline-block mb-6 select-all">
                           <span className="text-xl font-mono tracking-wider font-bold">{dsid}</span>
                        </div>
                        
                        <button onClick={() => setPage(2)} className="w-full bg-black text-white font-medium py-3 px-4 rounded-lg hover:bg-gray-800 transition-colors">
                          Proceed to API Integration &rarr;
                        </button>
                      </div>
                    )}
                 </div>
              </div>
            </div>
          )}

          {/* PAGE 2: USAGE */}
          {page === 2 && (
            <div className="h-full w-full flex flex-col pt-24 fade-in">
              <Header step="2" title="Third-Party Integration" />
              
              <div className="flex-1 flex flex-col items-center justify-center px-4 relative">
                 <div className="max-w-xl w-full">
                    
                    {/* Scenario Selector */}
                    {status === "idle" && !showConsent && (
                       <div className="mb-6 flex justify-center space-x-2 fade-in">
                          {Object.values(USE_CASES).map(uc => (
                             <button key={uc.id} onClick={() => setActiveUseCase(uc)} className={`px-3 py-1.5 text-xs font-medium rounded-full transition-colors ${activeUseCase.id === uc.id ? 'bg-black text-white shadow-md' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50'}`}>
                                {uc.label}
                             </button>
                          ))}
                       </div>
                    )}

                    <div className="bg-white border border-gray-200 p-6 rounded-xl shadow-sm">
                        <div className="flex justify-between items-center border-b border-gray-100 pb-3 mb-4">
                           <h3 className="font-medium text-gray-900">{activeUseCase.title}</h3>
                           <span className="text-[10px] px-2 py-1 bg-blue-50 text-blue-600 rounded uppercase font-bold tracking-wider">Verified Partner API</span>
                        </div>
                        
                        <form onSubmit={handleSubmitIntegration} className="space-y-4">
                          <div>
                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">{activeUseCase.role}</label>
                            <input type="text" value="Jane Doe (Verified by DPI)" disabled className="minimal-input w-full p-2.5 text-sm bg-gray-50 text-gray-500 cursor-not-allowed" />
                          </div>

                          {status === "idle" && (
                            <div className="pt-2">
                              <label className="block text-[10px] font-bold text-gray-900 uppercase tracking-wide mb-2">Sign via DSID</label>
                              <div className="flex space-x-2">
                                <input type="text" placeholder="Enter DSID manually..." value={enteredDsid} onChange={(e) => setEnteredDsid(e.target.value.toUpperCase())} className="minimal-input flex-1 p-2.5 font-mono text-sm" required />
                                <button type="submit" className="bg-black text-white text-sm font-medium px-4 rounded-md hover:bg-gray-800">Inject</button>
                              </div>
                            </div>
                          )}

                          {status === "approved" && (
                            <div className="pt-2 fade-in">
                              <p className="block text-[10px] font-bold text-green-600 uppercase tracking-wide mb-2">Cryptographically Signed</p>
                              <div className="bg-green-50 border border-green-100 p-3 rounded-lg flex items-center justify-between">
                                 <img src={signatureImage} className="h-10 object-contain" alt="Signature" />
                                 <span className="text-[10px] text-green-700 font-mono font-medium">{new Date().toLocaleTimeString()}</span>
                              </div>
                            </div>
                          )}
                        </form>
                        
                        {status === "approved" && (
                            <button onClick={() => setPage(3)} className="mt-6 w-full bg-black text-white font-medium py-3 px-4 rounded-lg hover:bg-gray-800 transition-colors">
                              View Dashboard &rarr;
                            </button>
                        )}
                    </div>
                 </div>

                 {/* REAL-TIME CONSENT MODAL */}
                 {showConsent && (
                    <div className="absolute inset-0 bg-white/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
                      <div className="bg-white border border-gray-200 rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
                        <div className="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center mx-auto mb-3">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                        </div>
                        <h3 className="text-lg font-medium tracking-tight mb-1">Authorization Required</h3>
                        <p className="text-xs text-gray-500 mb-6 leading-relaxed">
                          <strong className="text-black">{activeUseCase.entity}</strong> requests API access to inject your verified digital signature for {activeUseCase.consent}
                        </p>
                        <div className="flex space-x-2">
                          <button onClick={() => handleConsent(false)} className="flex-1 py-2.5 minimal-input bg-white text-gray-700 text-sm font-medium hover:bg-gray-50">Deny</button>
                          <button onClick={() => handleConsent(true)} className="flex-1 py-2.5 bg-black text-white rounded-md text-sm font-medium hover:bg-gray-800">Approve</button>
                        </div>
                      </div>
                    </div>
                 )}
              </div>
            </div>
          )}

          {/* PAGE 3: DASHBOARD */}
          {page === 3 && (
            <div className="h-full w-full flex flex-col pt-24 fade-in">
              <Header step="3" title="Citizen Audit Dashboard" />
              
              <div className="flex-1 flex flex-col items-center justify-center px-4 w-full">
                 <div className="max-w-3xl w-full">
                    
                    <div className="mb-6">
                       <h2 className="text-2xl font-medium tracking-tight mb-1">Security Ledger</h2>
                       <p className="text-sm text-gray-500">Track and revoke external access to your vaulted digital signature.</p>
                    </div>

                    <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                       <div className="bg-gray-50 px-5 py-3 border-b border-gray-200 flex justify-between items-center">
                          <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Access History</span>
                       </div>
                       
                       <table className="w-full text-left border-collapse table-fixed">
                          <thead>
                             <tr className="border-b border-gray-100 bg-white">
                                <th className="px-5 py-3 text-[10px] font-bold text-gray-400 uppercase tracking-wider w-1/4">Time</th>
                                <th className="px-5 py-3 text-[10px] font-bold text-gray-400 uppercase tracking-wider w-1/3">Entity</th>
                                <th className="px-5 py-3 text-[10px] font-bold text-gray-400 uppercase tracking-wider w-1/6">Status</th>
                                <th className="px-5 py-3 text-[10px] font-bold text-gray-400 uppercase tracking-wider w-1/4 text-right">Data Control</th>
                             </tr>
                          </thead>
                          <tbody className="text-sm bg-white">
                             {auditLogs.map((log) => (
                                <tr key={log.id} className="border-b border-gray-50">
                                   <td className="px-5 py-4 font-mono text-xs text-gray-500 truncate">{log.time}</td>
                                   <td className="px-5 py-4 font-medium text-gray-900 truncate">{log.entity}</td>
                                   <td className="px-5 py-4">
                                      <span className={`inline-flex items-center px-2 py-1 rounded-sm text-[10px] font-bold uppercase tracking-wide ${log.status === 'Approved' || log.status === 'Vaulted' ? 'bg-green-100 text-green-700' : log.status === 'Revoked' ? 'bg-gray-100 text-gray-600' : 'bg-red-100 text-red-700'}`}>
                                         {log.status}
                                      </span>
                                   </td>
                                   <td className="px-5 py-4 text-right">
                                       {log.status === 'Approved' ? (
                                           <button onClick={() => handleRevoke(log.id)} className="text-[10px] font-bold uppercase tracking-wide text-red-600 border border-red-200 py-1.5 px-2 rounded hover:bg-red-50 transition-colors">
                                               Revoke API
                                           </button>
                                       ) : (
                                           <span className="text-[10px] text-gray-400 uppercase tracking-wide font-bold">Locked</span>
                                       )}
                                   </td>
                                </tr>
                             ))}
                          </tbody>
                       </table>
                    </div>

                    <div className="flex justify-end pt-6">
                       <button onClick={() => setPage(4)} className="bg-black text-white font-medium py-3 px-6 rounded-lg hover:bg-gray-800 transition-colors">
                          Finish & Read Summary &rarr;
                       </button>
                    </div>

                 </div>
              </div>
            </div>
          )}

          {/* PAGE 4: CONCEPT NOTE SUMMARY & FINISH */}
          {page === 4 && (
            <div className="h-full w-full flex flex-col pt-24 fade-in">
              <Header step="4" title="System Summary" />
              
              <div className="flex-1 flex flex-col items-center justify-center px-4 w-full">
                 <div className="max-w-2xl w-full">
                    
                    <div className="bg-gray-900 text-white p-8 rounded-xl shadow-lg mb-8">
                       <h2 className="text-xl font-semibold mb-4 flex items-center">
                          <svg className="w-6 h-6 mr-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                          DSID Concept Note
                       </h2>
                       <div className="space-y-4 text-sm text-gray-300 leading-relaxed">
                           <p>
                              The proposed <strong>Digital Signature ID (DSID)</strong> framework solves a critical gap in India's digital governance. Currently, citizens repeatedly upload unsecure image files of their signatures to disconnected portals.
                           </p>
                           <p>
                              By integrating government-backed authentication APIs (like Aadhaar), secure storage, and real-time citizen consent, this proposed DPI layer prevents duplication, fraud, and creates true interoperability across hospitals, banks, and government systems.
                           </p>
                           <blockquote className="border-l-2 border-blue-400 pl-4 py-2 mt-4 text-white font-medium italic">
                              "UPI standardized digital payments. DSID can standardize digital signatures."
                           </blockquote>
                       </div>
                    </div>

                    <div className="flex justify-center">
                       <button onClick={resetApp} className="flex items-center text-sm font-semibold text-gray-500 hover:text-black uppercase tracking-wider transition-colors border border-gray-300 px-6 py-3 rounded-lg hover:border-black">
                         <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                         Restart Simulation
                       </button>
                    </div>

                 </div>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
